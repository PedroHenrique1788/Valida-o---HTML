const DECISIONS={
  3:{k:'DECISION DE REFORÇO · BLOCO 1',context:'Um colega assumiu um ticket cuja única anotação é: “Caso em andamento.”',q:'Qual atitude preserva a continuidade?',answers:['Dar continuidade sem consultar o histórico, pois o colega já iniciou o caso.','Consultar histórico, verificar ações anteriores e identificar a situação atual e as pendências.','Criar uma anotação “verificado” para sinalizar que o caso foi lido.'],correct:1,good:'Você aplicou o que aprendeu: um registro precisa permitir reconstruir contexto, atuação e próximo passo. O POP orienta consultar o histórico e os chamados existentes.',bad:['A frase “em andamento” não informa o que foi analisado nem o que resta fazer.','', '“Verificado” é genérico e não demonstra evidências ou encaminhamento.']},
  6:{k:'DECISION DE REFORÇO · BLOCO 2',context:'No primeiro contato pelas mídias, o cliente informa um defeito e diz que já possui atendimento aberto.',q:'O que precisa orientar sua análise inicial?',answers:['Solicitar dados previstos para a tratativa, consultar histórico e verificar chamados existentes.','Ignorar os chamados anteriores e seguir somente com o relato atual.','Presumir que a ausência de um número informado encerra a análise.'],correct:0,good:'Isso reúne as informações iniciais e evita perder a continuidade. O POP prevê defeito, NF, etiqueta com S/N e consulta a chamados em andamento.',bad:['','Ignorar o histórico pode gerar retrabalho e comprometer o acompanhamento.','Não invente uma regra de encerramento: consulte o processo e analise as informações disponíveis.']},
  9:{k:'DECISION DE REFORÇO · BLOCO 3',context:'Uma reclamação surgiu em um comentário público. O Marketing foi acionado, mas o cliente não respondeu à solicitação.',q:'Qual conduta segue a orientação documentada?',answers:['Solicitar repetidamente o contato para obter uma resposta mais rápida.','Publicar uma solicitação de dados pessoais no comentário.','Respeitar o fluxo de Marketing e não repetir a solicitação de contato quando não houver resposta.'],correct:2,good:'Correto. O POP registra o acionamento via Marketing e orienta não solicitar contato mais de uma vez se o cliente não responder, evitando aumentar o atrito.',bad:['A repetição não acompanha a orientação do POP e pode aumentar o atrito.','O fluxo de comentário público passa pelo Marketing; não presuma uma solicitação pública de dados.','']},
  12:{k:'DECISION · SITUAÇÃO 1/3',context:'Uma OS já está em andamento. Você assumiu o caso e precisa entender em que ponto está.',q:'Qual é o próximo movimento adequado?',answers:['Encerrar o atendimento sem verificar a OS.','Verificar status, solicitar retorno da ASC se necessário e manter acompanhamento diário.','Abrir outra OS automaticamente, sem conferir a existente.'],correct:1,good:'Correto. Essa combinação é a orientação da tabela do POP para ordem de serviço em andamento.',bad:['Ainda existe tratativa a analisar. O encerramento não decorre apenas da existência de uma OS.','', 'Antes de criar novas ações, é necessário compreender o caso já em andamento.']},
  13:{k:'DECISION · SITUAÇÃO 2/3',context:'Você verificou a OS e solicitou retorno à ASC. Ainda não houve resposta.',q:'Como deixar essa situação rastreável?',answers:['Registrar “ASC retornou; caso resolvido”.','Registrar apenas “aguardar”.','Registrar que o retorno foi solicitado e continua pendente, mantendo o acompanhamento previsto.'],correct:2,good:'Boa decisão. Você distingue uma ação realizada de uma resposta ainda pendente e preserva a continuidade. A simulação não estabelece um texto obrigatório de registro.',bad:['Não podemos afirmar que houve retorno ou resolução sem evidência.','“Aguardar” não esclarece qual pendência existe nem qual ação já foi tomada.','']},
  14:{k:'DECISION · SITUAÇÃO 3/3',context:'Outra pessoa assumirá a tratativa. Compare as opções de anotação simuladas.',q:'Qual delas permite compreender melhor o caso?',answers:['“Cliente chamou. Verificando.”','“OS em andamento; status consultado. Retorno solicitado à ASC e ainda pendente. Cliente contatado para atualização. Acompanhamento diário previsto.”','“Encerrado para organizar a fila.”'],correct:1,good:'A segunda opção esclarece contexto, ação, pendência e acompanhamento. É exemplo didático, não um modelo oficial de registro.',bad:['O texto não esclarece o histórico nem as pendências.','','Um registro não deve declarar encerramento apenas para remover uma pendência da fila.']},
  17:{k:'DECISION DE REFORÇO · BLOCO 5',context:'O acompanhamento de uma ordem de serviço ainda está pendente. Há necessidade de retorno ao cliente.',q:'Qual recurso está alinhado à necessidade imediata?',answers:['Usar um lembrete para o acompanhamento e manter o histórico atualizado.','Encerrar o atendimento como se a tratativa estivesse finalizada.','Marcar “Isso não é um ticket” para eliminar a pendência.'],correct:0,good:'O POP apresenta o lembrete como recurso para retorno ao cliente e acompanhamento de OS. Encerramento exige atendimento finalizado.',bad:['','A pendência ainda existe; o POP vincula encerramento à finalização do atendimento via SAC.','“Isso não é um ticket” é destinado a tickets indevidos ou fora do escopo, não a casos válidos pendentes.']},

const CHECKS=['O histórico e a situação atual estão claros?','A análise considera evidências relevantes?','O registro diferencia ações feitas e pendências?','O próximo direcionamento está compreensível?'];
const defaultState=()=>({scene:0,done:[],responses:{},explored:{},multi:{},multiAttempts:{},multiFeedback:{},matched:{},checklist:[],feedback:null,completedAt:null});
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(LEGACY_KEY));if(v&&Number.isInteger(v.scene)&&v.scene>=0&&v.scene<SCENES.length&&Array.isArray(v.done)){return {...defaultState(),...v,scene:Math.min(v.scene,SCENES.length-1)}}}catch(e){}return defaultState()}
let state=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...state,feedback:null}))}catch(e){}};
const uniq=a=>[...new Set(a)];
const done=n=>state.done.includes(n);
const isEnd=n=>SCENES[n]?.type==='end';
const seenExplore=n=>(state.explored[n]||[]).length===EXPLORES[n].items.length;
const correctMulti=n=>{const chosen=state.multi[n]||[];const target=MULTIS[n].options.flatMap((v,i)=>v[1]?[i]:[]);return chosen.length===target.length&&target.every(v=>chosen.includes(v))};
const correctMatch=n=>{const answers=state.matched[n]||{};return MATCHES[n].questions.every((q,i)=>answers[i]===q.correct)};
const eligible=n=>{if(done(n))return true;const s=SCENES[n];switch(s.type){case 'intro':case 'teach':return !!state.responses['ack'+n];case 'explore':return seenExplore(n);case 'multi':return !!state.responses['multiDone'+n];case 'match':return correctMatch(n);case 'decision':return state.responses['decision'+n]===DECISIONS[n].correct;case 'checklist':return state.checklist.length===4;case 'end':return true;default:return false}};
function mark(n){if(!state.done.includes(n)){state.done.push(n);state.done.sort((a,b)=>a-b);if(n===SCENES.length-2)state.completedAt=new Date().toISOString()}save()}
function posCurrent(){const screenX=window.innerWidth,screenY=window.innerHeight;const scale=Math.min(screenX/W,screenY/H);$('stage').style.transform=`translate(-50%,-50%) scale(${scale})`}
function escapeHtml(str){return String(str).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
const robot=()=>`<div class="robot-panel"><span class="float-tag lt">📨 NOVO CASO</span><div class="bot" aria-label="Rastro, robô investigador" role="img"><div class="bot-antenna"></div><div class="bot-foot l"></div><div class="bot-foot r"></div><div class="bot-hand l"></div><div class="bot-hand r"></div><div class="bot-body"><div class="bot-eye l"></div><div class="bot-eye r"></div><div class="bot-smile"></div></div><div class="bot-glass"></div></div><span class="float-tag rb">🔍 ENCONTRE O RASTRO</span></div>`;
function shell({kicker,title,subtitle,body,foot=''}){return `<div class="container"><div class="header"><div class="pill ${kicker?.includes('DECISION')?'gold':'slate'}">${kicker||'✦ APRENDIZAGEM'}</div><h1>${title}</h1>${subtitle?`<p>${subtitle}</p>`:''}</div><div class="content">${body}${foot?`<div class="info-line">${foot}</div>`:''}</div></div>`}
const ackButton=n=>`<button type="button" class="btn secondary small-action" data-action="ack" data-n="${n}">${state.responses['ack'+n]?'✓ Conteúdo compreendido':'✓ Compreendi, quero praticar'}</button>`;
function intro(n){return `<div class="completion" style="grid-template-columns:1.17fr .83fr;gap:40px"><div><div class="pill gold">🎮 MISSÃO 01 DE 06 · A JORNADA COMEÇA</div><h1 style="margin:19px 0 14px;font-size:51px;letter-spacing:-1.5px">Um atendimento.<br>Muitas pistas.<br><span class="focus-word">Uma história clara.</span></h1><p style="font-size:18px;color:#c7e1ed;line-height:1.55;max-width:690px">Você vai acompanhar uma tratativa fictícia de Mídias Sociais Hisense. Primeiro aprende, depois pratica e só então toma decisões para reforçar o que compreendeu.</p><div class="speech" style="margin-top:20px"><b>RASTRO DIZ:</b> “Eu encontro as pistas. Você constrói o raciocínio!”</div><div style="margin-top:18px">${ackButton(n)}</div><div class="caption" style="margin-top:12px">Referência: POP 15 · Tratativa de Mídias Sociais, versão 01. Casos fictícios.</div></div>${robot()}</div>`}
function teach(n){const d=TEXT.lessons[n];let t='Conteúdo antes do Decision',emoji='📖';const count=d.cards.length;const special=n===18;
  if(n===1)emoji='🧠';if(n===4)emoji='📚';if(n===7)emoji='💬';if(n===10)emoji='🧭';if(n===15)emoji='🖥️';if(n===18)emoji='📝';
  let inner=`<div class="${count===4?'gr4':count===2?'gr2':'gr3'}">${d.cards.map((x,i)=>`<article class="card ${i===0?'glow':''}" style="min-height:${count===4?200:214}px"><span class="emoji">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div>`;
  if(special){inner=`<div class="pair"><div class="ticket"><div class="ticket-head">REGISTRO A · SIMULADO <span>🌫️ GENÉRICO</span></div><div class="ticket-body"><p>“Cliente entrou em contato. Estamos verificando. Aguardar.”</p><small>Ficam indefinidos o histórico, a ação e o que ainda precisa acontecer.</small></div></div><div class="ticket"><div class="ticket-head">REGISTRO B · SIMULADO <span>✨ MAIS CLARO</span></div><div class="ticket-body"><p>“OS em andamento. Status verificado, retorno solicitado à ASC e ainda pendente. Cliente atualizado. Acompanhamento diário previsto.”</p><small>Expõe histórico, ação realizada, pendência e continuidade.</small></div></div></div>`}
  return shell({kicker:`${emoji} EXPLICAÇÃO · ANTES DA PRÁTICA`,title:SCENES[n].title,subtitle:d.lead,body:`${inner}<div class="mini-tip"><span class="icon">💡</span><div>${n===7?'Nos comentários, o POP determina o acionamento do Marketing. Em mensagem direta, a solicitação de dados pode ocorrer por mensagem privada.':n===15?'Outras funções do POP incluem arquivar temporariamente quando não há tratativa momentânea, imprimir ticket e “Isso não é um ticket” para casos indevidos.':n===18?'Esses textos são exemplos de aprendizagem, não scripts nem modelos oficiais de auditoria.': 'A finalidade do registro é permitir compreender a tratativa e manter a continuidade.'}</div></div><div>${ackButton(n)}</div>`})}
function explore(n){const d=EXPLORES[n];const opened=state.explored[n]||[];const active=state.responses['focus'+n];const item=Number.isInteger(active)?d.items[active]:null;return shell({kicker:'🔍 APRENDIZAGEM ATIVA · EXPLORE',title:d.title,subtitle:d.lead,body:`<div class="gr${d.items.length===4?4:3}">${d.items.map((x,i)=>`<button type="button" class="clue ${opened.includes(i)?'selected':''}" data-action="explore" data-n="${n}" data-i="${i}"><div class="number">PISTA ${i+1} ${opened.includes(i)?'· DESCOBERTA ✓':''}</div><h3 style="font-size:18px;margin-top:9px">${x[0]} ${x[1]}</h3><p>${opened.includes(i)?'Clique novamente para revisar.':'Toque para revelar a explicação.'}</p>${opened.includes(i)?'<span class="tick">✓</span>':''}</button>`).join('')}</div><div class="open-detail"><b>${item?'✦ '+item[1]:'🔎 Escolha uma pista acima'}</b><p>${item?item[2]:'Ao investigar as pistas, você constrói os conceitos que vai utilizar no Decision de reforço.'}</p></div><div class="row" style="display:flex;align-items:center;justify-content:space-between"><span class="counter">${opened.length} / ${d.items.length} pistas exploradas</span><span class="bookmark">${seenExplore(n)?'✓ Você pode seguir para o reforço.':'Explore todas para liberar a próxima tela.'}</span></div>`})}
function getMultiFeedback(n){
 const result=state.multiFeedback[n];
 if(!result || state.responses['multiDone'+n])return '';
 const d=MULTIS[n],attempts=state.multiAttempts[n]||0;
 const hint=attempts>=2?d.hint2:d.hint1;
 if(result.needsCheck){return `<section class="coach-feedback" role="status" aria-live="polite"><div class="coach-head">🤖 RASTRO · NOVA TENTATIVA</div><div class="coach-row"><p>Você alterou suas escolhas. Clique em <strong>Conferir pistas</strong> para atualizar o resultado.</p><button type="button" class="btn ghost compact" data-action="reviewMulti" data-n="${n}">📖 Revisar conceito</button></div><div class="coach-prompt">💡 ${escapeHtml(hint)}</div></section>`;}
 const fmt=(num,singular,plural)=>`${num} ${num===1?singular:plural}`;
 const missing=fmt(result.missing,'informação importante','informações importantes');
 const excess=fmt(result.excess,'seleção sem relação','seleções sem relação');
 return `<section class="coach-feedback" role="status" aria-live="polite"><div class="coach-head">🤖 RASTRO · DICA ${Math.min(attempts,3)} · VOCÊ ESTÁ INVESTIGANDO</div><div class="coach-metrics"><span class="metric">✓ ${result.found} de ${result.total} pistas pertinentes</span>${result.missing?`<span class="metric warn">🔍 ${result.missing===1?'Falta':'Faltam'} ${missing}</span>`:`<span class="metric">✓ Nenhuma pista importante faltando</span>`}${result.excess?`<span class="metric warn">🧹 Revise ${excess}</span>`:`<span class="metric">✓ Sem seleções indevidas</span>`}</div><div class="coach-row"><p>💡 ${escapeHtml(hint)}</p>${attempts>=2?`<button type="button" class="btn ghost compact" data-action="reviewMulti" data-n="${n}">📖 Revisar conteúdo</button>`:''}</div></section>`;
}
function multi(n){const d=MULTIS[n],chosen=state.multi[n]||[],done=!!state.responses['multiDone'+n],coach=getMultiFeedback(n);return shell({kicker:'🧪 APRENDIZAGEM ATIVA · INVESTIGUE',title:d.title,subtitle:d.lead,body:`${n===19?`<div class="case-mini"><div><strong>📂 CASO: OS EM ANDAMENTO</strong><div>Status verificado · retorno à ASC pendente · cliente contatado</div></div><div class="case-note"><strong>REGISTRO:</strong> “Cliente chamou, estamos vendo o caso. Aguardar.”</div></div>`:''}<div class="select-grid">${d.options.map((x,i)=>`<label class="check"><input type="checkbox" data-action="multiCheck" data-n="${n}" data-i="${i}" ${chosen.includes(i)?'checked':''} ${done?'disabled':''}><span>${escapeHtml(x[0])}</span></label>`).join('')}</div><div style="display:flex;align-items:center;gap:15px"><span class="counter">${chosen.length} itens selecionados</span>${done?`<span class="pill">✓ Prática concluída</span>`:`<button type="button" class="btn secondary compact" data-action="submitMulti" data-n="${n}">Conferir pistas →</button>`}</div>${done?`<div class="feedback"><b>✓ Análise concluída</b>${d.feedback}</div>`:coach||'<div class="info-line gold">Selecione o que considera pertinente e clique em “Conferir pistas”. Se errar, o Rastro dirá quantas faltam e quantas precisam ser revistas.</div>'}`})}

function match(n){const d=MATCHES[n],responses=state.matched[n]||{},step=d.questions.findIndex((q,i)=>responses[i]!==q.correct),qindex=step===-1?d.questions.length-1:step,q=d.questions[qindex],all=correctMatch(n);return shell({kicker:'🧩 APRENDIZAGEM ATIVA · ASSOCIE',title:SCENES[n].title,subtitle:d.lead,body:`<div class="row" style="display:flex;align-items:center;gap:10px">${d.questions.map((x,i)=>`<span class="pill ${responses[i]===x.correct?'':'slate'}">${responses[i]===x.correct?'✓':'○'} SITUAÇÃO ${i+1}</span>`).join('')}</div>${all?`<div class="card glow" style="padding:27px"><span class="emoji">🏅</span><h3>Você relacionou corretamente as ${d.questions.length} situações.</h3><p>${n===8?'O canal de entrada influencia a abordagem inicial prevista no POP.':'Os recursos do HugMe servem a propósitos diferentes dentro da tratativa.'}</p></div>`:`<div class="card" style="min-height:110px"><div class="mini">CENÁRIO ${qindex+1}</div><h3 style="font-size:20px">${q.q}</h3></div><div class="${q.options.length===3?'gr3':'gr2'}">${q.options.map((x,i)=>`<button type="button" class="choice" data-action="match" data-n="${n}" data-i="${qindex}" data-v="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${x}</span></button>`).join('')}</div><div class="info-line gold">Se errar, o Rastro explica o raciocínio. A atividade só termina depois de resolver todas as situações.</div>`}`})}
function decision(n){const d=DECISIONS[n],correct=state.responses['decision'+n]===d.correct;return shell({kicker:'🎲 '+d.k,title:d.q,subtitle:'Você já recebeu a explicação e praticou. Agora aplique o raciocínio para reforçar a aprendizagem.',body:`<div class="ticket"><div class="ticket-head">📨 MENSAGEM DO CASO <span>SIMULAÇÃO</span></div><div class="ticket-body"><p>${d.context}</p></div></div><div class="${d.answers.length===3?'gr3':'gr2'}">${d.answers.map((x,i)=>`<button type="button" class="choice ${correct&&i===d.correct?'chosen':''}" data-action="decision" data-n="${n}" data-v="${i}" ${correct?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${x}</span></button>`).join('')}</div>${correct?'<div class="feedback"><b>✓ Reforço concluído</b>Você aplicou o conceito. O feedback faz parte da mesma tela; nenhuma etapa adicional é necessária.</div>':'<div class="mini-tip"><span class="icon">🤖</span><span><strong>Rastro:</strong> “Decida com base no que foi explicado e demonstrado nas telas anteriores. Você pode tentar novamente.”</span></div>'}`})}
function checklist(n){return shell({kicker:'📌 CONSOLIDAÇÃO · CONSULTA POSTERIOR',title:'O que você deve conseguir explicar agora?',subtitle:'Marque cada critério depois de revisar. Este checklist é um apoio didático e não substitui o POP vigente.',body:`<div class="gr2">${CHECKS.map((v,i)=>`<label class="check" style="min-height:105px;font-size:17px"><input type="checkbox" data-action="checklist" data-i="${i}" ${state.checklist.includes(i)?'checked':''}><span>${v}</span></label>`).join('')}</div><div class="info-line"><strong>Referência operacional:</strong> POP 15 — Tratativa de Mídias Sociais, versão 01. Para procedimentos e orientações detalhadas, consulte a versão vigente da operação.</div><div style="display:flex;align-items:center;justify-content:space-between"><span class="counter">${state.checklist.length}/4 critérios revisados</span><button type="button" class="btn secondary compact" data-action="download">↓ Baixar checklist para consulta</button></div>`})}
function ending(n){return `<div class="completion"><div><span class="pill">🏁 JORNADA CONCLUÍDA</span><h1 style="margin-top:23px">Missão <span class="focus-word">cumprida!</span></h1><p>Você passou pelas telas na sequência, recebeu conteúdo antes de cada atividade, praticou e resolveu os Decisions de reforço.</p><div class="speech"><b>RASTRO DIZ:</b> “Um bom registro deixa pistas suficientes para o próximo atendimento continuar!”</div><div class="info-line" style="margin-top:22px"><strong>Na rotina:</strong> registre somente o que realmente foi analisado e realizado. Consulte sempre o POP vigente para o fluxo detalhado.</div><div style="display:flex;gap:12px;margin-top:20px"><button type="button" class="btn secondary" data-action="download">↓ Checklist</button><button type="button" class="btn ghost" data-action="restart">↻ Refazer desde o início</button></div><p class="caption" style="margin-top:10px;font-size:12px">Concluído neste navegador. Integração de nota e conclusão com o Academy depende do método de publicação.</p></div><div><div class="seal"><span>🏆</span><b>GUARDIÃO DE RASTROS</b><small>Hisense • Mídias Sociais</small></div></div></div>`}
function render(){const n=state.scene,s=SCENES[n],chap=CHAPTERS[s.c];const maxOpen=Math.min(SCENES.length-1,Math.max(0,...state.done)+1);if(n>maxOpen){state.scene=maxOpen;return render()}
 $('chapterTag').textContent=`CAPÍTULO ${s.c+1} DE 6`;$('chapterName').textContent=chap.name;$('pageCount').textContent=`TELA ${String(n+1).padStart(2,'0')}/${SCENES.length}`;
 $('progressCount').textContent=`${state.done.length}/${SCENES.length-1}`;
 $('trackDots').innerHTML=CHAPTERS.map((x,i)=>`<div class="chapter-dot ${i<s.c?'complete':i===s.c?'current':''}" title="Bloco ${i+1} · ${x.name} · ${x.time}" aria-label="Bloco ${i+1} de 6: ${x.name}${i>s.c?' ainda bloqueado':''}"></div>`).join('');
 const kinds={intro,teach,explore,multi,match,decision,checklist,end:ending};$('scene').innerHTML=kinds[s.type](n);$('scene').dataset.kind=s.type;
 $('prevBtn').disabled=n===0;$('nextBtn').style.display=s.type==='end'?'none':'';
 $('nextBtn').disabled=!eligible(n);$('nextBtn').textContent=n===SCENES.length-2?'Concluir missão 🏁': 'Continuar →';
 $('footerNote').innerHTML=s.type==='decision'?'<b>Decision de reforço.</b> Escolha, leia o feedback e avance depois de acertar.':s.type==='teach'?'<b>Primeiro o conteúdo.</b> Confirme sua leitura para liberar a prática guiada.':s.type==='explore'||s.type==='multi'||s.type==='match'?'<b>Agora a aprendizagem ativa.</b> Resolva antes do Decision de reforço.':s.type==='end'?'<b>Você concluiu todas as telas da jornada.</b>':'<b>Jornada sequencial.</b> Voltar é permitido; pular telas futuras não.';
 $('scene').setAttribute('aria-label',s.title);document.title=`${s.title} | Rastreabilidade em Ação`;
 bind();save();
}
function openFeedback(ok,title,body){state.feedback={ok,title,body};const container=document.createElement('div');container.className='mask';container.id='feedbackMask';container.setAttribute('role','dialog');container.setAttribute('aria-modal','true');container.setAttribute('aria-labelledby','feedbackTitle');container.innerHTML=`<div class="modal"><div class="pill ${ok?'':'gold'}">${ok?'✓ FEEDBACK DE REFORÇO':'↺ FEEDBACK PARA APRENDER'}</div><h2 id="feedbackTitle">${escapeHtml(title)}</h2><p>${escapeHtml(body)}</p><div class="dialog-actions"><button type="button" id="closeFeedback" class="btn main">${ok?'Entendi ✓':'Rever e tentar novamente →'}</button></div></div>`;
 $('overlayRoot').replaceChildren(container);$('closeFeedback').focus();$('closeFeedback').addEventListener('click',()=>{state.feedback=null;$('overlayRoot').replaceChildren();render();});
}
function onAction(action,el){const n=Number(el.dataset.n),i=Number(el.dataset.i),v=Number(el.dataset.v);
 if(action==='ack'){state.responses['ack'+n]=true;render();return}
 if(action==='explore'){const arr=state.explored[n]||[];state.explored[n]=uniq([...arr,i]);state.responses['focus'+n]=i;render();return}
 if(action==='multiCheck'){let arr=state.multi[n]||[];state.multi[n]=el.checked?uniq([...arr,i]):arr.filter(a=>a!==i);if(state.multiFeedback[n])state.multiFeedback[n]={needsCheck:true};render();return}
 if(action==='checklist'){const a=state.checklist;state.checklist=el.checked?uniq([...a,i]):a.filter(x=>x!==i);render();return}
 if(action==='submitMulti'){
  const chosen=state.multi[n]||[],d=MULTIS[n];
  if(!chosen.length){state.multiFeedback[n]={needsCheck:true};render();return}
  if(correctMulti(n)){state.responses['multiDone'+n]=true;delete state.multiFeedback[n];openFeedback(true,'Pistas conectadas!',d.feedback)}
  else{
   const target=d.options.flatMap((v,j)=>v[1]?[j]:[]);
   const found=chosen.filter(j=>target.includes(j)).length;
   state.multiAttempts[n]=(state.multiAttempts[n]||0)+1;
   state.multiFeedback[n]={found,total:target.length,missing:target.length-found,excess:chosen.length-found};
   render();
  }
  return;
 }
 if(action==='reviewMulti'){
  const lesson=TEXT.lessons[n===5?4:18];
  popup('Relembrando as pistas',`<p>${escapeHtml(lesson.lead)}</p><div class="zoom-copy" style="margin-top:15px">${lesson.cards.map(x=>`<div class="card"><h3>${x[0]} ${escapeHtml(x[1])}</h3><p>${escapeHtml(x[2])}</p></div>`).join('')}</div>`,true);
  return;
 }
 if(action==='match'){const q=MATCHES[n].questions[i];if(v===q.correct){state.matched[n]={...(state.matched[n]||{}),[i]:v};openFeedback(true,'Associação correta!',q.why)}else openFeedback(false,'Ainda não é esse o caminho',q.why);return}
 if(action==='decision'){const d=DECISIONS[n];if(v===d.correct){state.responses['decision'+n]=v;openFeedback(true,'Ótima decisão!',d.good)}else openFeedback(false,'Vamos rever o raciocínio',d.bad[v]||'Reveja as evidências e o procedimento descrito no conteúdo anterior.');return}
 if(action==='download'){downloadChecklist();return}
 if(action==='restart'){const ok=window.confirm('Deseja reiniciar a jornada? O progresso local será apagado.');if(ok){state=defaultState();save();render()}return}
}
function bind(){document.querySelectorAll('[data-action]').forEach(el=>{const e=el.tagName==='INPUT'?'change':'click';el.addEventListener(e,()=>onAction(el.dataset.action,el))})}
function go(step){if(step>state.scene){if(!eligible(state.scene))return;mark(state.scene);state.scene=Math.min(state.scene+1,SCENES.length-1)}else if(step<state.scene){state.scene=Math.max(0,state.scene-1)}render();$('scene').focus({preventScroll:true})}
function downloadChecklist(){const lines=['RASTREABILIDADE EM AÇÃO · HISENSE','Checklist didático de continuidade','',...CHECKS.map(v=>'[ ] '+v),'','Referência: POP 15 — Tratativa de Mídias Sociais, versão 01 (02/03/2026).','Não é modelo oficial de auditoria nem substitui o procedimento vigente.'];const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Checklist_Rastreabilidade_Hisense.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function popup(title,html,zoom=false){const root=document.createElement('div');root.className='mask';root.id='miscMask';root.setAttribute('role','dialog');root.setAttribute('aria-modal','true');root.innerHTML=`<div class="modal ${zoom?'wide':''}"><div class="pill">${zoom?'🔎 MODO DE LEITURA':'ⓘ GUIA DA JORNADA'}</div><h2>${escapeHtml(title)}</h2>${html}<div class="dialog-actions"><button type="button" id="closeMisc" class="btn main">Voltar à missão →</button></div></div>`;$('overlayRoot').replaceChildren(root);$('closeMisc').addEventListener('click',()=>$('overlayRoot').replaceChildren());$('closeMisc').focus()}
function zoom(){const n=state.scene,s=SCENES[n],l=TEXT.lessons[n];let html='';if(s.type==='teach'&&l){html=`<p style="font-size:20px">${l.lead}</p><div class="zoom-copy" style="margin-top:20px">${l.cards.map(x=>`<div class="card"><h3>${x[0]} ${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div>`}else if(s.type==='decision'){const d=DECISIONS[n];html=`<p style="font-size:21px">${escapeHtml(d.context)}</p><div class="info-line" style="font-size:21px;margin-top:20px">${escapeHtml(d.q)}</div>`}else if(s.type==='explore'){const d=EXPLORES[n],opened=state.explored[n]||[];html=`<div class="zoom-copy">${d.items.filter((x,i)=>opened.includes(i)).map(x=>`<div class="card"><h3>${x[0]} ${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div><p style="margin-top:15px">Abra as demais pistas na tela principal.</p>`}else{html=`<p style="font-size:21px">${escapeHtml(s.title)}</p><p style="margin-top:16px">Use o modo tela cheia para ampliar a experiência sem rolagem. O curso foi desenhado para visualização em computador.</p>`}popup('Leitura ampliada · '+s.title,html,true)}
function help(){popup('Como funciona esta jornada?',`<ul class="help-text"><li><strong>Ordem obrigatória:</strong> em cada bloco, explicação → atividade guiada → Decision de reforço.</li><li><strong>Dicas nas seleções:</strong> ao conferir uma seleção incorreta, o Rastro informa quantas pistas faltam, quantas seleções são indevidas e sugere como rever o conceito.</li><li><strong>Avanço:</strong> cada tela precisa ser concluída para habilitar “Continuar”. O mapa indica o progresso, mas não abre telas futuras.</li><li><strong>Voltar:</strong> você pode voltar quantas vezes quiser. Os feedbacks não contam como telas adicionais.</li><li><strong>Tela cheia:</strong> clique em “Tela cheia” para ocupar o monitor, se o Academy permitir. “Ampliar” mostra os textos em destaque.</li><li><strong>Sem rolagem:</strong> as telas usam composição fixa com ajuste automático de escala.</li><li><strong>Progresso:</strong> a retomada é salva neste navegador quando o armazenamento local estiver disponível. Conclusão no LMS depende da integração com Academy.</li><li><strong>Fonte:</strong> POP 15 — Tratativa de Mídias Sociais, versão 01. Simulações não substituem procedimentos.</li></ul>`)}
$('prevBtn').addEventListener('click',()=>go(state.scene-1));$('nextBtn').addEventListener('click',()=>go(state.scene+1));$('helpBtn').addEventListener('click',help);$('zoomBtn').addEventListener('click',zoom);
$('fullscreenBtn').addEventListener('click',async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else{await document.documentElement.requestFullscreen()}posCurrent()}catch(e){popup('Tela cheia indisponível','<p>O navegador ou o ambiente de incorporação pode bloquear o modo tela cheia. Abra este HTML diretamente em uma aba ou configure permissões de tela cheia no Academy.</p>')}});
document.addEventListener('fullscreenchange',()=>{$('fullscreenBtn').textContent=document.fullscreenElement?'⛶ Sair da tela cheia':'⛶ Tela cheia';posCurrent()});
window.addEventListener('resize',posCurrent);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('miscMask'))$('overlayRoot').replaceChildren()});
// Evita quebrar a sequência caso um estado local antigo seja adulterado ou incompleto.
state.done=state.done.filter(n=>Number.isInteger(n)&&n>=0&&n<SCENES.length-1);
let allowed=0;while(state.done.includes(allowed)&&allowed<SCENES.length-1)allowed++;state.done=state.done.filter(n=>n<allowed);state.scene=Math.min(state.scene,allowed);
posCurrent();render();
})();
</script>
</body></html>
