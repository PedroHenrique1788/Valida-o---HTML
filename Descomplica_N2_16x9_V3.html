{m:0,k:'Diagnóstico inicial',title:'Qual mensagem você enviaria?',lead:'Imagine que um cliente de revenda solicita uma atualização. A informação ainda está em análise. Compare as respostas. Os exemplos deste treinamento são fictícios e não substituem procedimentos ou mensagens oficiais.',html:`<div class="chat"><small>CLIENTE · REVENDA</small><p>Olá. Gostaria de saber se já existe uma atualização sobre a minha solicitação.</p></div>`,qs:[Q('Escolha a resposta mais adequada.',['Oi, tudo bem? Tô vendo aqui, te falo assim que der.','Olá! Sua solicitação está em análise. Assim que houver uma atualização confirmada, informaremos você.','Prezado, mediante os trâmites supramencionados, daremos a tratativa cabível.'],1,'A segunda resposta é formal, natural e precisa. A primeira é informal e vaga; a terceira usa termos desnecessariamente complexos. Nenhuma informação deve ser inventada.')]},
{m:1,k:'Registro profissional',title:'Formal não significa distante.',lead:'A linguagem formal é adequada ao contexto profissional: respeita as convenções da escrita, evita intimidade excessiva e comunica o necessário de forma natural.',html:`<div class="compare"><div class="bad"><small>INFORMAL DEMAIS</small><p>Opa! Manda aí os docs pra gente ver, blz?</p></div><div class="good"><small>FORMAL E NATURAL</small><p>Olá! Poderia enviar os documentos para que possamos analisá-los?</p></div></div><p>Use saudações adequadas, palavras completas e frases diretas. Não é necessário usar “prezado senhor” em todas as mensagens: respeite o contexto e as orientações do canal.</p><div class="callout"><b>Respeito à diversidade linguística</b><p>Expressões informais fazem parte da língua. O objetivo não é desvalorizar a maneira como alguém fala, mas adequar a escrita ao atendimento profissional.</p></div>`,qs:[Q('Qual frase mantém a cordialidade sem excesso de informalidade?',['Manda o comprovante aí, por favor.','Solicito a remessa da documentação supracitada.','Por gentileza, envie o comprovante para análise.'],2,'A terceira opção faz um pedido claro, cordial e adequado ao registro profissional.'),Q('O que deve orientar a escolha da linguagem?',['O contexto, a necessidade do cliente e o padrão de comunicação da operação.','A obrigação de utilizar palavras difíceis.','A preferência pessoal do analista, independentemente do canal.'],0,'Formalidade é adequação ao contexto. O cliente precisa entender a informação, não decifrar termos difíceis.')]},
{m:1,k:'Vícios de linguagem',title:'Substitua hábitos por informações.',lead:'Abreviações informais, diminutivos, expressões vagas e repetições podem reduzir a clareza da mensagem. O problema não é a palavra isolada, mas seu efeito no contexto.',html:`<div class="examples"><div><span>“Só um minutinho, tá?”</span><strong>“Por favor, aguarde um momento.”</strong></div><div><span>“Vou ver esse negócio com o pessoal.”</span><strong>“Vou verificar sua solicitação com a equipe responsável.”</strong></div><div><span>“Vc pode mandar os docs?”</span><strong>“Você pode enviar os documentos?”</strong></div></div><p>Não substitua uma incerteza real por uma afirmação falsa. Quando não souber uma informação, diga o que está confirmado e qual será a ação de verificação.</p>`,qs:[Q('Qual mensagem é mais precisa?',['A gente vai dar uma olhadinha nisso.','Vou verificar a informação sobre sua solicitação.','Tá bom, vamos ver essa coisa.'],1,'A segunda identifica a ação sem recorrer a palavras vagas ou diminutivos.'),Q('A confirmação ainda não foi recebida. O que escrever?',['Com certeza o acordo foi aprovado.','Eu acho que já deu certo, viu?','Ainda não recebemos a confirmação. Vou verificar a situação.'],2,'A terceira é transparente. Segurança na escrita não significa afirmar algo que não foi confirmado.')]},
{m:1,k:'Gerúndio',title:'Gerúndio ou gerundismo?',lead:'O gerúndio (-ando, -endo, -indo) é uma forma verbal legítima. Pode indicar ação em andamento, simultânea ou outras relações. Evite o gerundismo quando torna uma ação simples desnecessariamente longa.',html:`<div class="compare"><div class="good"><small>AÇÃO EM ANDAMENTO</small><p>Estamos analisando a documentação.</p></div><div class="bad"><small>FUTURO DESNECESSARIAMENTE LONGO</small><p>Vou estar analisando a documentação.</p><b>Prefira: Vou analisar a documentação.</b></div></div><p>Para uma ação futura simples, “vou verificar” ou “verificarei” costuma ser suficiente. Não elimine o gerúndio de todas as mensagens.</p>`,qs:[Q('Qual frase usa o gerúndio de forma adequada para uma ação em andamento?',['Estamos verificando os dados neste momento.','Vou estar verificando os dados amanhã, caso necessário.','Vou estar entrando em contato para estar informando.'],0,'“Estamos verificando” descreve uma ação que está ocorrendo agora.'),Q('Reescreva a ideia de uma ação futura simples: “Vou estar encaminhando a solicitação”.',['Estou encaminhando a solicitação ontem.','Vou encaminhar a solicitação.','Vou estar podendo encaminhar a solicitação.'],1,'“Vou encaminhar” mantém o sentido de futuro com menos palavras.')]},
{m:2,k:'Concordância verbal',title:'O verbo acompanha o sujeito.',lead:'Concordância verbal é a relação entre sujeito e verbo. Em geral, se o sujeito está no plural, o verbo também fica no plural.',html:`<div class="rule"><b>Localize quem realiza a ação.</b><p>O documento <strong>foi</strong> recebido. → Os documentos <strong>foram</strong> recebidos.</p><p>A informação <strong>está</strong> disponível. → As informações <strong>estão</strong> disponíveis.</p></div><p>Mesmo quando o sujeito vem depois do verbo, observe o número: “Chegaram os documentos”.</p>`,qs:[Q('Complete: “Os comprovantes ___ recebidos.”',['foi','foram','estava'],1,'O sujeito “os comprovantes” está no plural, então usamos “foram”.'),Q('Qual mensagem está correta?',['Chegou os documentos solicitados.','As informações está disponível.','Chegaram os documentos solicitados.'],2,'“Os documentos” é sujeito plural, mesmo depois do verbo. “As informações estão disponíveis” também seria a forma correta da segunda frase.')]},
{m:2,k:'Verbos impessoais',title:'Houve ou houveram? Faz ou fazem?',lead:'Quando “haver” significa existir ou ocorrer, fica no singular. “Fazer”, quando indica tempo decorrido, também fica no singular.',html:`<div class="rule"><b>Haver = existir/ocorrer</b><p>Houve duas atualizações. / Existem duas atualizações.</p><b>Fazer = tempo decorrido</b><p>Faz três dias que recebemos os documentos.</p></div><p>O verbo “existir” concorda com seu sujeito. Já “haver” no sentido de existir é impessoal: não tem sujeito.</p>`,qs:[Q('Complete: “___ duas alterações na solicitação.”',['Houveram','Houve','Haviam'],1,'No sentido de ocorrer, o verbo haver fica no singular: houve.'),Q('Complete: “___ dois dias que a análise começou.”',['Faz','Fazem','Fizeram'],0,'Quando indica tempo decorrido, “fazer” é impessoal e fica no singular.'),Q('Qual frase está correta?',['Existe duas pendências.','Existem duas pendências.','Houveram duas pendências.'],1,'“Existir” concorda com o sujeito plural. “Haver” no sentido de existir fica no singular.')]},
{m:2,k:'Concordância nominal',title:'Artigos, nomes e adjetivos em harmonia.',lead:'Artigos e adjetivos normalmente concordam em gênero e número com o substantivo a que se referem.',html:`<div class="rule"><p>O documento atualizado → Os documentos atualizados.</p><p>A informação confirmada → As informações confirmadas.</p><p>“Menos” é invariável: menos informações, menos documentos.</p><p>“Meio” no sentido de um pouco não varia: a mensagem está meio confusa. Quando indica metade, varia: meia hora.</p></div>`,qs:[Q('Qual frase está correta?',['As informações solicitada estão disponíveis.','As informações solicitadas estão disponíveis.','As informação solicitadas estão disponíveis.'],1,'O artigo, o substantivo e o adjetivo concordam no feminino plural.'),Q('Complete: “Precisamos de ___ informações complementares.”',['menas','menos'],1,'“Menos” não varia em gênero ou número.'),Q('Complete: “A informação está ___ confusa.”',['meia','meio'],1,'No sentido de “um pouco”, meio é advérbio e não varia.')]},
{m:2,k:'Palavras parecidas',title:'Mas, mais, mal e mau.',lead:'Palavras semelhantes podem ter sentidos diferentes. Teste a substituição antes de enviar.',html:`<div class="cards two"><div><b>Mas</b><p>Contraste: Recebemos a mensagem, mas ainda não concluímos a análise.</p></div><div><b>Mais</b><p>Quantidade: Precisamos de mais informações.</p></div><div><b>Mal</b><p>Oposto de bem: O documento foi mal preenchido.</p></div><div><b>Mau</b><p>Oposto de bom: O cliente relatou um mau atendimento.</p></div></div>`,qs:[Q('“Recebemos o comprovante, ___ precisamos verificar os dados.”',['mais','mas'],1,'“Mas” indica contraste entre duas ideias.'),Q('“Precisamos de ___ detalhes sobre a solicitação.”',['mas','mais'],1,'“Mais” indica quantidade adicional.'),Q('“O documento foi ___ preenchido.”',['mau','mal'],1,'O contrário é bem preenchido, portanto mal.'),Q('“O cliente relatou um ___ atendimento.”',['mal','mau'],1,'O contrário é bom atendimento, portanto mau.')]},
{m:2,k:'Tempo e pronomes',title:'Há, a, eu e mim.',lead:'Algumas escolhas dependem da função da palavra na frase, não apenas do som.',html:`<div class="rule"><b>Há × a</b><p>Há dois dias = tempo passado. / Daqui a dois dias = tempo futuro.</p><b>Para eu × para mim</b><p>Envie o documento para eu analisar. (“eu” é sujeito de analisar.)</p><p>Envie o documento para mim. (“mim” é complemento.)</p></div>`,qs:[Q('“A solicitação foi recebida ___ dois dias.”',['a','há'],1,'“Há” indica tempo decorrido.'),Q('“A atualização ocorrerá daqui ___ dois dias”, se esse prazo estiver confirmado.',['há','a'],1,'“A” indica tempo futuro.'),Q('“Envie o documento para ___ conferir.”',['mim','eu'],1,'“Eu” é o sujeito do verbo conferir.'),Q('“O documento foi encaminhado para ___.”',['eu','mim'],1,'“Mim” é complemento da preposição; não é sujeito de um verbo nessa frase.')]},
{m:2,k:'Ortografia',title:'Escolha as palavras pelo sentido.',lead:'Uma pequena troca de letras pode alterar a informação transmitida. Na dúvida, prefira uma palavra simples e consulte uma referência de ortografia.',html:`<div class="rule"><p><b>Retificar:</b> corrigir. “Precisamos retificar os dados.”</p><p><b>Ratificar:</b> confirmar. “A equipe ratificou a informação.”</p><p><b>Onde:</b> lugar. “Onde está o documento?”</p><p><b>Aonde:</b> destino com verbo que pede a preposição a. “Aonde você vai?”</p></div><div class="callout"><b>Na escrita profissional</b><p>“Por isso” e “de repente” são escritos separadamente. “Bem-vindo” usa hífen. Prefira “em que” ao se referir a situações abstratas: “a etapa em que o pedido se encontra”.</p></div>`,qs:[Q('Há um erro no cadastro. Precisamos ___ os dados.',['ratificar','retificar'],1,'Retificar significa corrigir; ratificar significa confirmar.'),Q('Qual escrita está correta?',['Porisso, precisamos conferir os dados.','Por isso, precisamos conferir os dados.','Por isso precisamos conferír os dados.'],1,'“Por isso” é escrito separadamente e “conferir” não recebe acento.'),Q('“___ está o comprovante?”',['Onde','Aonde'],0,'“Estar” indica localização, não destino.')]},
{m:2,k:'Os quatro porquês',title:'Qual porquê usar?',lead:'A escrita muda de acordo com a função na frase. Aplique o sentido, não apenas a posição.',html:`<div class="cards two"><div><b>Por que</b><p>Pergunta direta ou indireta: Por que houve a alteração? / Explique por que houve a alteração.</p></div><div><b>Porque</b><p>Explicação ou causa: A análise continua porque faltam dados.</p></div><div><b>Por quê</b><p>No fim de uma pergunta ou antes de pontuação final: Houve alteração por quê?</p></div><div><b>Porquê</b><p>Substantivo, significa motivo: Informe o porquê da alteração.</p></div></div>`,qs:[Q('“Poderia informar ___ o documento foi alterado?”',['porque','por que','porquê'],1,'É uma pergunta indireta sobre a razão da alteração: por que.'),Q('“A análise continua ___ faltam informações.”',['porque','por quê','porquê'],0,'Porque introduz uma explicação ou causa.'),Q('“Ainda não sabemos o ___ da divergência.”',['por que','por quê','porquê'],2,'O artigo “o” indica o substantivo porquê, equivalente a motivo.'),Q('“Houve uma alteração, mas ainda não sabemos ___.”',['por quê','porque','por que'],0,'A expressão interrogativa no fim da frase recebe acento: por quê.')]},
{m:3,k:'Pontuação',title:'A pontuação orienta a leitura.',lead:'Na escrita, o cliente não ouve a nossa entonação. Pontos, vírgulas e parágrafos ajudam a separar ideias e indicar a intenção da mensagem.',html:`<div class="compare"><div class="bad"><small>SEM ORGANIZAÇÃO</small><p>Olá João recebemos os dados vamos verificar as informações assim que houver atualização retornaremos.</p></div><div class="good"><small>COM ORGANIZAÇÃO</small><p>Olá, João! Recebemos os dados e vamos verificar as informações. Assim que houver uma atualização, retornaremos.</p></div></div><p>Separe o vocativo (nome ou tratamento de quem recebe a mensagem) por vírgula. Não separe sujeito e verbo com vírgula. Use ponto final para encerrar ideias completas.</p>`,qs:[Q('Qual saudação está corretamente pontuada?',['Olá João tudo bem?','Olá, João! Tudo bem?','Olá João, tudo bem.'],1,'O vocativo João deve ser isolado. A pergunta termina com ponto de interrogação.'),Q('Qual frase não tem vírgula indevida?',['Os documentos, foram recebidos.','Os documentos foram recebidos.','Os, documentos foram recebidos.'],1,'Não se separa sujeito e verbo por vírgula.')]},
{m:3,k:'Organização da mensagem',title:'Uma resposta que o cliente consegue seguir.',lead:'Use esta estrutura flexível como apoio à escrita. Nem toda mensagem exige as quatro partes, mas a informação relevante precisa ficar clara.',html:`<div class="steps"><div><b>01</b><section><h3>Acolher</h3><p>Reconheça a solicitação ou preocupação.</p></section></div><div><b>02</b><section><h3>Contextualizar</h3><p>Informe o que está confirmado.</p></section></div><div><b>03</b><section><h3>Direcionar</h3><p>Descreva a ação que pode ser realizada.</p></section></div><div><b>04</b><section><h3>Alinhar expectativas</h3><p>Indique o próximo passo e prazo somente quando houver confirmação.</p></section></div></div><div class="chat agent"><small>EXEMPLO · ACORDOS</small><p>Olá! Compreendo sua preocupação. Recebemos sua solicitação e ainda estamos verificando as informações. Assim que houver uma atualização confirmada, informaremos você.</p></div><p>Este modelo é didático, não um fluxo oficial. Adapte à situação e ao procedimento aplicável.</p>`,qs:[Q('A solicitação ainda está em análise. Qual informação deve constar?',['Uma data inventada para tranquilizar o cliente.','A situação confirmada e o próximo passo aplicável.','Somente “aguarde”, sem contexto.'],1,'O cliente precisa de informação precisa. Não prometa um resultado ou prazo sem confirmação.')]},
{m:3,k:'Revisão',title:'Revise antes de enviar.',lead:'A atenção à escrita é um comportamento profissional. Uma revisão rápida identifica erros de língua portuguesa e informações imprecisas.',html:`<div class="callout"><b>Checklist em três leituras</b><p><strong>1. Conteúdo:</strong> respondi ao que o cliente solicitou? As informações estão confirmadas?</p><p><strong>2. Forma:</strong> a mensagem é cordial, formal, objetiva e organizada?</p><p><strong>3. Língua:</strong> conferi ortografia, concordância, pontuação, nomes, datas e valores?</p></div><div class="chat"><small>MENSAGEM PARA REVISAR</small><p>Olá Maria, os documento foi recebido mais vamos estar conferindo os dados.</p></div>`,qs:[Q('Qual revisão resolve os problemas sem alterar o sentido?',['Olá, Maria! Os documentos foram recebidos, mas vamos conferir os dados.','Olá Maria! Os documento foram recebido mais vamos conferir os dados.','Olá, Maria! Os documentos foram aprovados e o acordo será pago.'],0,'A primeira corrige vocativo, concordância, mas/mais e gerundismo, sem inventar aprovação ou pagamento.')]},
{m:4,k:'Laboratório · Revenda',title:'Revenda: reescreva a mensagem.',lead:'Agora pratique a produção escrita. Use suas próprias palavras. As informações disponíveis são fictícias: os documentos chegaram e serão analisados; ainda não há confirmação de resultado.',html:`<div class="chat"><small>CLIENTE · REVENDA</small><p>Enviei os documentos. Vocês receberam? Já tem alguma resposta?</p></div><div class="chat agent draft"><small>RASCUNHO DO ANALISTA</small><p>Oi, tudo bem? Os documento chegou, vou estar vendo aqui e te aviso, tá?</p></div>`,write:W('Reescreva a resposta em linguagem formal, mantendo apenas as informações confirmadas.','Olá! Recebemos os documentos e vamos analisá-los. Assim que houver uma atualização confirmada, informaremos você.',['Cumprimentei o cliente de forma adequada.','Corrigi a concordância e retirei o gerundismo desnecessário.','Evitei abreviações e informalidade excessiva.','Não acrescentei resultado ou prazo não confirmado.'])},
{m:4,k:'Laboratório · Acordos',title:'Acordos: comunique uma pendência.',lead:'O cliente quer saber se o acordo foi concluído. A única informação confirmada é que a solicitação está em análise; ainda não há confirmação de conclusão.',html:`<div class="chat"><small>CLIENTE · ACORDOS</small><p>Já entrei em contato anteriormente. Meu acordo foi concluído?</p></div><div class="chat agent draft"><small>RASCUNHO DO ANALISTA</small><p>Então, eu acho que sim mais não sei direito, vou estar olhando esse negócio pra vc.</p></div>`,write:W('Escreva uma resposta profissional que reconheça a dúvida e comunique a situação real.','Olá! Compreendo sua preocupação. Sua solicitação está em análise e ainda não temos a confirmação da conclusão do acordo. Vou verificar as informações disponíveis.',['Reconheci a dúvida do cliente com respeito.','Usei palavras completas e corrigi mas/mais.','Informei que a conclusão ainda não foi confirmada.','Apresentei uma ação sem inventar prazo ou promessa.'])},
{m:4,k:'Laboratório · Revisão final',title:'Revisão de precisão.',lead:'Em um atendimento de Revenda, a analista precisa comunicar que houve duas atualizações na solicitação e que ainda faltam informações. Revise a mensagem antes do envio.',html:`<div class="chat agent draft"><small>RASCUNHO DO ANALISTA</small><p>Olá Ana, houveram duas atualização mais ainda falta informações. Envie os documento para mim verificar.</p></div>`,write:W('Reescreva a mensagem corrigindo os problemas de português, sem alterar os fatos.','Olá, Ana! Houve duas atualizações, mas ainda faltam informações. Por gentileza, envie os documentos para eu verificar.',['Isolei o vocativo por vírgula.','Usei “houve” e fiz a concordância no plural.','Usei “mas” para contraste.','Usei “para eu verificar” e mantive a cordialidade.'])},
{m:5,k:'Preparação',title:'Você chegou à avaliação.',lead:'Agora, coloque em prática o que aprendeu. Leia cada situação com atenção e escolha a alternativa mais adequada.',html:`<div class="callout"><b>Como funciona</b><p>Selecione uma resposta em cada questão. O resultado e as justificativas serão apresentados após o envio. Se precisar, revise o conteúdo e realize uma nova tentativa.</p></div><p>As atividades anteriores são formativas; os textos livres foram revisados por comparação e autoavaliação, não por um corretor automático. A nota final considera apenas as questões objetivas.</p>`},
{m:5,k:'Avaliação',title:'Avaliação final',lead:'Leia atentamente cada situação e selecione a opção mais adequada.',exam:true},
{m:5,k:'Conclusão',title:'Leve essa prática para cada mensagem.',lead:'A formalidade não está apenas nas palavras: está no cuidado com a informação, na clareza da escrita e no respeito ao cliente.',html:`<div class="callout"><b>Antes de enviar, revise.</b><p>Confira a informação, o registro formal, a ortografia, a concordância e a pontuação. Consulte o guia sempre que tiver dúvidas.</p></div><p>O guia de consulta permanece disponível durante e após o treinamento.</p><button class="secondary" data-action="guide">Abrir guia de consulta</button>`}
];
const exam=[
Q('1. Um cliente de Revenda solicita uma atualização ainda não confirmada. Qual resposta é adequada?',['Tô vendo aqui, te aviso quando der.','Olá! Ainda não temos uma atualização confirmada. Vou verificar as informações.','Prezado, com certeza estará tudo concluído amanhã.'],1,'A segunda mantém a formalidade e não inventa uma confirmação.'),
Q('2. Se a análise está acontecendo agora, qual frase está adequada?',['Estamos analisando a solicitação.','Vamos estar podendo analisar a solicitação.','Estaremos analisando ontem.'],0,'O gerúndio é adequado para a ação que está em andamento.'),
Q('3. Complete: “As solicitações ___ encaminhadas para análise.”',['foi','estava','foram'],2,'O sujeito plural exige verbo no plural: foram.'),
Q('4. Qual frase está correta?',['Houveram três atualizações.','Houve três atualizações.','Fazem dois dias que houve atualização.'],1,'Haver, no sentido de ocorrer, é impessoal; fazer, indicando tempo decorrido, também.'),
Q('5. Complete: “O cliente enviou os dados, ___ ainda precisamos de ___ informações.”',['mais / mas','mas / mais','mas / mas'],1,'Mas indica contraste; mais indica quantidade.'),
Q('6. “O cliente informou que foi ___ atendido.”',['mau','mal','má'],1,'Mal é o oposto de bem.'),
Q('7. Complete: “Solicitamos o comprovante ___ três dias.”',['a','à','há'],2,'Há indica tempo decorrido.'),
Q('8. Qual mensagem está correta?',['Envie os dados para mim verificar.','Envie os dados para eu verificar.','Envie os dados para eu.'],1,'Eu é sujeito de verificar. Na terceira frase, o correto seria para mim.'),
Q('9. “Ainda não recebemos a confirmação ___ faltam informações.”',['porquê','por que','porque'],2,'Porque introduz a causa.'),
Q('10. O cliente de Acordos aguarda confirmação. Qual resposta é mais adequada?',['Olá, Carla! Sua solicitação está em análise. Ainda não temos a confirmação da conclusão. Vou verificar as informações.','Olá Carla, o acordo já foi concluído com certeza.','Oi Carla! Tá tudo certo, só aguardar um pouquinho.'],0,'A primeira mensagem usa pontuação adequada, linguagem formal e informações compatíveis com o cenário.')];
const modules=[['01','Comece por aqui',3],['02','Formalidade na escrita',7],['03','Português aplicado',12],['04','Organização e revisão',5],['05','Laboratório de escrita',7],['06','Avaliação e conclusão',6]];
const guide=[['Formalidade','Use palavras completas, saudação adequada e linguagem respeitosa. Evite abreviações informais, intimidade excessiva e termos vagos.'],['Gerúndio e gerundismo','Ação em curso: “Estamos analisando”. Futuro simples: “Vou analisar”, em vez de “vou estar analisando”.'],['Concordância verbal','O documento foi recebido; os documentos foram recebidos. O verbo concorda com o sujeito, mesmo quando vem depois.'],['Haver e fazer','Houve duas alterações. Faz três dias. Quando indicam existência/ocorrência e tempo decorrido, respectivamente, ficam no singular. Existir concorda: existem duas pendências.'],['Concordância nominal','As informações confirmadas. Menos não varia. Meio = um pouco (meio confusa); meia = metade (meia hora).'],['Mas e mais','Mas = contraste. Mais = quantidade.'],['Mal e mau','Mal é oposto de bem; mau é oposto de bom.'],['Há e a','Há dois dias (passado). Daqui a dois dias (futuro).'],['Eu e mim','Para eu analisar (sujeito). Para mim (complemento).'],['Ratificar e retificar','Ratificar = confirmar. Retificar = corrigir.'],['Onde e aonde','Onde = localização. Aonde = destino, com verbo que pede a preposição a.'],['Por que / porque / por quê / porquê','Por que = pergunta direta ou indireta. Porque = explicação. Por quê = fim de pergunta ou antes de pontuação final. Porquê = motivo, substantivo.'],['Ortografia','Por isso; de repente; bem-vindo; estender; extensão. Na dúvida, consulte uma referência de língua portuguesa.'],['Pontuação','Olá, Ana! Isole o vocativo. Não separe sujeito e verbo por vírgula. Divida ideias longas em frases curtas.'],['Estrutura e revisão','Acolha, contextualize, direcione e alinhe expectativas quando aplicável. Revise fatos, nomes, valores, datas, formalidade e gramática. Não invente prazos ou resultados.']];

const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({p:0,sub:0,max:0,a:{},w:{},e:{},score:null,passed:false,complete:false});let state=fresh();const KEY='descomplica-n2-escrita-16x9-v2';
let api=null,initialized=false,closed=false;function findAPI(w){try{for(let i=0;w&&i<20;i++){if(w.API)return w.API;if(w.parent===w)break;w=w.parent}}catch(e){}return null}try{api=findAPI(window)||findAPI(window.opener);if(api)initialized=api.LMSInitialize('')==='true';}catch(e){}
function get(k){try{return initialized?api.LMSGetValue(k):''}catch(e){return ''}}function set(k,v){try{if(initialized)api.LMSSetValue(k,String(v))}catch(e){}}function commit(){try{if(initialized)api.LMSCommit('')}catch(e){}}
try{const raw=initialized?get('cmi.suspend_data'):localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&Number.isInteger(s.p)&&s.p>=0&&s.p<pages.length)state={...fresh(),...s}}}catch(e){}
if(initialized){if(!state.complete)set('cmi.core.lesson_status','incomplete');set('cmi.core.score.min',0);set('cmi.core.score.max',100);$('#save-status').textContent='Progresso registrado no ambiente de aprendizagem (SCORM).'}
function save(){if(initialized){const compact={...state,w:Object.fromEntries(Object.entries(state.w).map(([k,v])=>[k,{done:v.done,revealed:v.revealed,checks:v.checks||[]}]))};set('cmi.suspend_data',JSON.stringify(compact));set('cmi.core.lesson_location',state.p);if(state.score!==null)set('cmi.core.score.raw',state.score);set('cmi.core.lesson_status',state.complete?'passed':(state.score!==null&&!state.passed?'failed':'incomplete'));set('cmi.core.exit',state.complete?'':'suspend');commit()}else{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){$('#save-status').textContent='O navegador não permitiu salvar o progresso; mantenha esta aba aberta.'}}}
const sessionStart=Date.now();function endSession(){if(initialized&&!closed){save();let t=Math.floor((Date.now()-sessionStart)/1000);set('cmi.core.session_time',`${String(Math.floor(t/3600)).padStart(4,'0')}:${String(Math.floor(t%3600/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`);commit();try{api.LMSFinish('')}catch(e){}closed=true}}window.addEventListener('pagehide',endSession);
function qKey(i){return `${state.p}-${i}`};function frameCount(p){return p.exam?exam.length+1:p.qs?1+p.qs.length:1}
const totalFrames=pages.reduce((n,p)=>n+frameCount(p),0);function frameNo(){return pages.slice(0,state.p).reduce((n,p)=>n+frameCount(p),0)+state.sub+1}
state.sub=Math.min(Math.max(0,Number(state.sub)||0),frameCount(pages[state.p])-1);
function isPageDone(){const p=pages[state.p];if(p.qs&&state.sub>0)return state.a[qKey(state.sub-1)]!==undefined;if(p.write)return !!state.w[state.p]?.done;if(p.exam)return state.sub<exam.length?state.e[state.sub]!==undefined:state.passed;return true}
function renderNav(){$('#player').classList.toggle('cover-mode',state.p===0);let progress=state.complete?100:Math.round(state.max/pages.length*100);$('#progress-label').textContent=`${progress}% concluído`;$('#progress-fill').style.width=progress+'%';$('.progress').setAttribute('aria-valuenow',progress);$('#slide-count').textContent=`TELA ${String(frameNo()).padStart(2,'0')} / ${totalFrames}`;$('#modules').innerHTML=modules.map((m,i)=>{let start=pages.findIndex(p=>p.m===i),end=pages.findLastIndex(p=>p.m===i),done=state.max>end||state.complete;return `<button class="module ${pages[state.p].m===i?'active':''}" data-jump="${start}" ${start>state.max?'disabled':''} ${pages[state.p].m===i?'aria-current="step"':''}><span class="num">${done?'✓':m[0]}</span><span>${m[1]}${done?'<small>Concluído</small>':''}</span></button>`}).join('');$('#back').disabled=state.p===0&&state.sub===0;let p=pages[state.p];$('#next').disabled=!isPageDone()||state.complete&&state.p===pages.length-1;$('#next').textContent=state.p===pages.length-1?(state.complete?'Concluído ✓':'Concluir treinamento'):(p.exam&&state.sub===exam.length-1?'Revisar e enviar →':'Continuar →');$('#nav-status').textContent=isPageDone()?(state.complete&&state.p===pages.length-1?'Treinamento concluído.':''):(p.exam?(state.sub===exam.length?'Revise o conteúdo ou tente novamente.':'Selecione uma resposta.'):p.write?'Escreva, compare e revise sua resposta.':'Responda à atividade para avançar.');updateScrollHint()}
function renderQuestion(q,i,examMode=false){const a=examMode?state.e[i]:state.a[qKey(i)];const submitted=examMode?state.score!==null:a!==undefined;let id=`${examMode?'e':'q'}-${i}`;return `<div class="question" id="${id}"><fieldset><legend>${esc(q.prompt)}</legend>${q.options.map((o,j)=>{let cl=a===j?'selected':'';if(submitted&&j===q.correct)cl+=' correct';if(submitted&&a===j&&j!==q.correct)cl+=' wrong';return `<label class="option ${cl}"><input type="radio" name="${id}" value="${j}" ${a===j?'checked':''} ${submitted?'disabled':''} data-q="${i}" data-exam="${examMode?1:0}"><span>${esc(o)}${submitted&&j===q.correct?' <b>✓</b>':''}</span></label>`}).join('')}</fieldset>${submitted?`<div class="feedback ${a===q.correct?'':'wrong'}" role="status"><strong>${a===q.correct?'Resposta correta.':'Vamos revisar.'}</strong>${esc(q.why)}</div>`:(!examMode?'<div class="status">Selecione uma opção para receber o feedback.</div>':'')}</div>`}
function writeHTML(w){const s=state.w[state.p]||{},revealed=!!s.revealed||s.done;return `<section class="writing"><label for="response">${esc(w.prompt)}</label><textarea id="response" maxlength="1500" placeholder="Escreva sua resposta aqui...">${esc(s.text||'')}</textarea><p class="status" id="draft-info">${s.done&&!s.text?'Resposta já revisada em sessão anterior. O texto livre não é enviado ao LMS.':'O texto livre não recebe nota automática. Compare com o modelo e revise sua própria escrita.'}</p><button class="primary" id="reveal" ${(!s.text||s.text.trim().length<20)&&!revealed?'disabled':''}>${revealed?'Modelo disponível':'Comparar com o modelo'}</button>${revealed?`<div class="model"><h3>Uma possibilidade de resposta</h3><p>${esc(w.model)}</p><p>Outras respostas podem estar corretas. Revise seu texto e confirme os critérios abaixo.</p>${w.criteria.map((c,i)=>`<label class="criteria"><input type="checkbox" data-criterion="${i}" ${s.checks?.includes(i)?'checked':''}><span>${esc(c)}</span></label>`).join('')}<button id="done-writing" class="secondary" ${s.checks?.length===w.criteria.length?'':'disabled'}>${s.done?'Revisão concluída ✓':'Concluir minha revisão'}</button></div>`:''}</section>`}
function examHTML(){if(state.sub<exam.length)return `<div class="question-slide"><div class="practice-head"><span class="slide-label">Questão ${state.sub+1} de ${exam.length}</span><span class="pill">AVALIAÇÃO · 10 PONTOS</span></div>${renderQuestion(exam[state.sub],state.sub,true)}</div>`;if(state.score===null)return `<section class="results"><h2>Pronto para enviar?</h2><p>${Object.keys(state.e).length} de ${exam.length} questões respondidas.</p><button class="primary" id="submit-exam" ${Object.keys(state.e).length===exam.length?'':'disabled'}>Enviar avaliação</button></section>`;return `<section class="results ${state.passed?'':'fail'}" aria-live="polite"><div class="score">${state.score}%</div><h2>${state.passed?'Aprovado!':'Continue praticando.'}</h2><p>${state.passed?'Você foi aprovado. Avance para a conclusão.':'Revise o conteúdo ou tente novamente.'} Use Anterior para conferir cada questão e sua justificativa.</p>${state.passed?'':`<div class="button-row"><button class="secondary" data-action="review">Revisar conteúdo</button><button class="primary" data-action="retry">Nova tentativa</button></div>`}</section><div class="review-list">${exam.map((q,i)=>`<div class="review-item ${state.e[i]===q.correct?'':'wrong'}"><b>${i+1}. ${state.e[i]===q.correct?'Correta ✓':'Revisar'}</b><p>${esc(q.why)}</p></div>`).join('')}</div>`}
function render(focus=false){const p=pages[state.p];let body=p.html||'',title=p.title,lead=p.lead;if(p.qs&&state.sub>0){body=`<div class="question-slide"><div class="practice-head"><span class="slide-label">Exercício ${state.sub} de ${p.qs.length}</span><span class="pill">PRATIQUE · SEM NOTA</span></div>${renderQuestion(p.qs[state.sub-1],state.sub-1)}</div>`;lead='Aplique o que acabou de aprender. Selecione uma alternativa para receber o feedback.';if(state.p===1)body=p.html+body;if(state.p===14){let holder=document.createElement('div');holder.innerHTML=p.html;body=holder.querySelector('.chat').outerHTML+body}}else if(p.write){body=`<div class="write-layout"><div>${body}</div>${writeHTML(p.write)}</div>`}else if(p.exam){body=examHTML();if(state.sub===exam.length){title='Resultado da avaliação';lead='Confira seu desempenho e as justificativas.'}}else if(state.p===pages.length-1&&state.complete){body+=`<section class="results"><div class="score">${state.score}%</div><h2>Treinamento concluído</h2><p>Você foi aprovado na avaliação. ${initialized?'O resultado foi enviado ao ambiente SCORM.':'O resultado está salvo neste navegador.'}</p></section>`}$('#page').dataset.unit=state.p;$('#page').innerHTML=state.p===0?body:`<div class="breadcrumb">${modules[p.m][0]} / ${esc(modules[p.m][1])} · ${esc(p.k)}</div><h1 id="heading" tabindex="-1">${esc(title)}</h1><p class="lead">${esc(lead)}</p>${body}`;if(p.write&&$('.model')){let col=document.createElement('div');col.className='model-col';col.append($('.model'));$('.write-layout>div').append(col)}renderNav();if(focus){$('#main').scrollTop=0;$('#heading').focus({preventScroll:true})}requestAnimationFrame(updateScrollHint)}
function go(p,sub=0){state.p=p;state.sub=sub;save();render(true)}
$('#next').addEventListener('click',()=>{if(!isPageDone())return;if(state.sub<frameCount(pages[state.p])-1){go(state.p,state.sub+1);return}if(state.p===pages.length-1){if(state.passed){state.complete=true;save();render(true)}return}state.max=Math.max(state.max,state.p+1);go(state.p+1)});$('#back').addEventListener('click',()=>{if(state.sub>0)go(state.p,state.sub-1);else if(state.p>0)go(state.p-1,frameCount(pages[state.p-1])-1)});function toggleMenu(open){$('#sidebar').classList.toggle('open',open);$('#menu-shade').classList.toggle('open',open);$('#menu').setAttribute('aria-expanded',open)}$('#modules').addEventListener('click',e=>{let b=e.target.closest('[data-jump]');if(b&&!b.disabled){go(+b.dataset.jump);toggleMenu(false)}});$('#menu').addEventListener('click',()=>toggleMenu(!$('#sidebar').classList.contains('open')));$('#menu-shade').addEventListener('click',()=>toggleMenu(false));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sidebar').classList.contains('open'))toggleMenu(false)});
function fitPlayer(){const scale=Math.min(innerWidth/1280,innerHeight/720);$('#fit').style.width=1280*scale+'px';$('#fit').style.height=720*scale+'px';$('#player').style.transform=`scale(${scale})`;updateScrollHint()}function updateScrollHint(){const el=$('#main');$('#scroll-hint').classList.toggle('visible',el.scrollHeight-el.clientHeight-el.scrollTop>8)}window.addEventListener('resize',fitPlayer);$('#main').addEventListener('scroll',updateScrollHint);$('#fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('O navegador ou o ambiente de aprendizagem bloqueou a tela cheia. Use F11, se disponível.')}});document.addEventListener('fullscreenchange',()=>{$('#fullscreen').textContent=document.fullscreenElement?'⛶ Sair da tela cheia':'⛶ Tela cheia';fitPlayer()});fitPlayer();
$('#page').addEventListener('change',e=>{let t=e.target;if(t.matches('[data-q]')){let i=+t.dataset.q;if(t.dataset.exam==='1'){if(state.score!==null)return;state.e[i]=+t.value;let q=t.closest('.question');q.querySelectorAll('.option').forEach(l=>l.classList.toggle('selected',l.querySelector('input').checked));save();renderNav()}else{if(state.a[qKey(i)]!==undefined)return;state.a[qKey(i)]=+t.value;save();let q=t.closest('.question');q.outerHTML=renderQuestion(pages[state.p].qs[i],i);let f=$(`#q-${i} .feedback`);f.tabIndex=-1;f.focus({preventScroll:true});renderNav()}}if(t.matches('[data-criterion]')){let s=state.w[state.p];s.checks=Array.from(document.querySelectorAll('[data-criterion]:checked')).map(x=>+x.dataset.criterion);s.done=false;$('#done-writing').disabled=s.checks.length!==pages[state.p].write.criteria.length;$('#done-writing').textContent='Concluir minha revisão';save();renderNav()}});
$('#page').addEventListener('input',e=>{if(e.target.id==='response'){let s=state.w[state.p]||={};s.text=e.target.value;state.w[state.p]=s;if(!s.revealed&&!s.done)$('#reveal').disabled=s.text.trim().length<20;if(s.done){s.done=false;$('#done-writing').textContent='Concluir minha revisão';renderNav()}save()}});
$('#page').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.id==='reveal'){let s=state.w[state.p];if(!s||(!s.revealed&&!s.done&&(s.text||'').trim().length<20))return;s.revealed=true;s.checks=s.checks||[];save();render();$('.model').scrollIntoView({block:'nearest'});$('.model h3').tabIndex=-1;$('.model h3').focus({preventScroll:true})}if(b.id==='done-writing'){let s=state.w[state.p];if(s.checks.length!==pages[state.p].write.criteria.length)return;s.done=true;save();render();$('#done-writing').focus({preventScroll:true});renderNav()}if(b.id==='submit-exam'){if(Object.keys(state.e).length!==exam.length||state.score!==null)return;state.score=exam.reduce((n,q,i)=>n+(state.e[i]===q.correct?10:0),0);state.passed=state.score>=80;save();render(true);$('.results').tabIndex=-1;$('.results').focus()}if(b.dataset.action==='retry'){state.e={};state.score=null;state.passed=false;state.complete=false;state.sub=0;save();render(true)}if(b.dataset.action==='review')go(2)});
const dialog=$('#guide-dialog');function openGuide(){if(!dialog.open){dialog.showModal();$('#search').value='';renderGuide();$('#search').focus()}}function renderGuide(){let norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let q=norm($('#search').value.trim());let matches=guide.filter(g=>norm(g.join(' ')).includes(q));$('#guide-list').innerHTML=matches.length?matches.map(g=>`<div class="guide-item"><h3>${esc(g[0])}</h3><p>${esc(g[1])}</p></div>`).join(''):'<p>Nenhum resultado. Tente outra palavra.</p>'}document.addEventListener('click',e=>{if(e.target.closest('[data-action="guide"]'))openGuide()});$('#close-guide').addEventListener('click',()=>dialog.close());$('#search').addEventListener('input',renderGuide);render();save();
