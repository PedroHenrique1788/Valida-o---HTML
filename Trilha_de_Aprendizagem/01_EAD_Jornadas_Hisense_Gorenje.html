let saved=defaultSaved();

let active=0,activeTab=0,conceptFocus=0,caseIndex=0,quizIndex=null,questionIndex=0,quizScore=0,quizAnswered=null,quizFinished=false,lookupTerm='',overlayIsOpen=false;

const normalize=(x)=>String(x||'').toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');

 const paths={'clipboard-list':'<rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5.5h6M8 11h8M8 15h8"/>','file-check':'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h5M9 15l2 2 4-4"/>','messages-square':'<path d="M4 5h13a3 3 0 0 1 3 3v8H9l-5 4z"/><path d="M8 10h8M8 13h5"/>','megaphone':'<path d="m3 10 13-6v14L3 14zM16 7l4-2v12l-4-2M6 15l2 5h4l-2-6"/>','shield-check':'<path d="M12 2 4 6v6c0 6 4 9 8 10 4-1 8-4 8-10V6z"/><path d="m8 12 3 3 5-6"/>','store':'<path d="M3 10h18l-2-6H5zM5 10v11h14V10M9 21v-7h6v7"/>','package-check':'<path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10M8 8l8 5"/>','timer':'<circle cx="12" cy="13" r="8"/><path d="M9 2h6M12 13l3-4M19 5l2-2"/>'};
 return `<svg ${custom} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${paths[name]||paths['clipboard-list']}</svg>`;

function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(saved));}catch(e){}}
function fit(){const ratio=Math.min(innerWidth/1440,innerHeight/810)*.991;$('#stage').style.setProperty('--scale',String(ratio));}
addEventListener('resize',fit);fit();
function navigate(idOrIndex){let i=typeof idOrIndex==='number'?idOrIndex:STAGES.findIndex(x=>x.id===idOrIndex);if(i<0)i=0;i=Math.max(0,Math.min(STAGES.length-1,i));active=i;activeTab=0;quizIndex=null;quizAnswered=null;quizFinished=false;lookupTerm='';saved.lastStage=i;if(!saved.visited.includes(i))saved.visited.push(i);persist();closeOverlay();render();}
function updateChrome(){const stage=STAGES[active];$('#stage-count').innerHTML=`ETAPA ${String(active+1).padStart(2,'0')} <small>/ ${STAGES.length}</small>`;$('#chapter-name').textContent=stage.title;$('#prev-button').disabled=active===0;$('#next-button').disabled=active===STAGES.length-1;$('#next-button').innerHTML=active===STAGES.length-2?'Finalizar jornada &nbsp; →':'Avançar &nbsp; →';const p=Math.round(saved.visited.length/STAGES.length*100);$('#progress-label').textContent=`${p}% explorado`;$('#progress-bar').style.width=p+'%';}
function render(){updateChrome();const {kind,index}=STAGES[active];let out='';if(kind==='intro')out=renderHome();if(kind==='concept')out=renderConcept();if(kind==='map')out=renderMap();if(kind==='journey')out=renderJourney(index);if(kind==='practice')out=renderPractice();if(kind==='lookup')out=renderLookup();if(kind==='quiz')out=renderQuiz();if(kind==='end')out=renderEnd();$('#scene').innerHTML=`<div class="scene-enter" style="height:100%">${out}</div>`;wireScene();}
function renderHome(){const hasLast=saved.lastStage>0;return `<div class="hero-layout"><div class="hero-left"><div class="kicker"><span class="dot"></span> SUA EXPERIÊNCIA COMEÇA AQUI</div><h1 class="hero-h">Todo atendimento<br>tem um <span>caminho.</span></h1><p class="hero-p">Você está na linha de frente. O cliente apresenta uma necessidade — e sua missão é descobrir qual jornada assume a continuidade. Explore, decida, pratique e retome sempre que precisar.</p><div class="hero-actions"><button class="button button-primary" data-go="${hasLast?saved.lastStage:1}">${hasLast?'Retomar minha jornada':'Começar minha jornada'} &nbsp; →</button><button class="button button-ghost" data-go="map">Explorar o mapa ◈</button></div><div class="mini-proof"><span>8 jornadas</span><span>6 situações práticas</span><span>3 desafios</span></div></div><div class="hero-illustration"><div class="hero-ring"></div><svg class="hero-svg" viewBox="0 0 550 510" aria-hidden="true"><path d="M275 82 Q450 94 448 236 Q445 407 280 426 Q85 405 94 237 Q101 100 275 82" stroke="#65dec6" stroke-width="3" fill="none" stroke-dasharray="5 8"/><path d="M275 82 Q450 94 448 236 Q445 407 280 426 Q85 405 94 237 Q101 100 275 82" stroke="#86eadd" stroke-width="14" fill="none" opacity=".04"/></svg><div class="hero-node n1"><span class="node-number">01</span><span>Cliente chega</span></div><div class="hero-node n2"><span class="node-number">02</span><span>Entenda o caso</span></div><div class="hero-center"><span class="tiny">SUA MISSÃO</span><strong>Próximo passo?</strong></div><div class="hero-node n3"><span class="node-number">03</span><span>Rota correta</span></div><div class="hero-node n4"><span class="node-number">04</span><span>Continuidade</span></div></div></div>`;}
const conceptSteps=[{icon:'◉',title:'O cliente procura ajuda',lead:'O caso começa com uma necessidade, reclamação, dúvida ou retorno.',desc:'Escute a necessidade apresentada. A demanda pode ser uma visita técnica, acordo aprovado, reclamação pública, recall, solicitação de revenda ou OS sem andamento.'},{icon:'⌕',title:'Você identifica o cenário',lead:'A origem e o status da solicitação ajudam a reconhecer a rota.',desc:'Identifique informações como existência de OS, aprovação de acordo, origem da reclamação, marca e revenda, ou lote envolvido em recall.'},{icon:'➜',title:'A jornada correta assume',lead:'Cada jornada possui uma responsabilidade na continuidade.',desc:'O objetivo não é conhecer apenas o nome de cada área: é entender quando ela entra no caso e qual próximo passo realiza.'},{icon:'✓',title:'O cliente tem continuidade',lead:'Um bom registro permite que a tratativa siga sem repetição.',desc:'Quando o histórico e as informações essenciais seguem juntos, o cliente não precisa contar tudo novamente em cada contato.'}];
function renderConcept(){return `<div class="intro-head"><div class="kicker"><span class="dot"></span> CAPÍTULO 01 · A MISSÃO</div><h1 class="page-title">O que é uma jornada de atendimento?</h1><p class="page-lead">É o caminho que o caso percorre dentro da operação. Clique em cada etapa para entender como sua decisão influencia a experiência do cliente.</p></div><div class="concept-track">${conceptSteps.map((s,i)=>`<button class="concept-tile ${conceptFocus===i?'active':''}" data-concept="${i}"><span class="concept-num">0${i+1}</span><div class="concept-icon">${s.icon}</div><h3>${esc(s.title)}</h3><p>${esc(s.lead)}</p></button>`).join('')}</div><div class="concept-detail panel"><strong>Etapa 0${conceptFocus+1} · ${esc(conceptSteps[conceptFocus].title)}</strong><span>${esc(conceptSteps[conceptFocus].desc)}</span></div><div style="margin-top:24px;display:flex;gap:12px;align-items:center"><button class="button button-primary" data-go="map">Conhecer as oito jornadas →</button><span class="faint" style="font-size:12px">Você poderá voltar a qualquer etapa pelo mapa.</span></div>`;}
function renderMap(){return `<div class="map-head"><div><div class="kicker"><span class="dot"></span> CAPÍTULO 02 · ESCOLHA UMA ROTA</div><h1 class="page-title">Mapa das jornadas</h1><p class="page-lead">O mesmo atendimento pode exigir caminhos diferentes. Selecione qualquer jornada para descobrir quando ela entra em cena e qual é sua função.</p></div><div class="counter-pill">◈ &nbsp; 8 rotas disponíveis</div></div><div class="map-grid">${DATA.journeys.map((j,i)=>`<button class="map-card ${saved.visited.includes(i+3)?'visited':''}" style="--accent:${j.color}" data-go="${j.id}"><span class="map-index">JORNADA 0${i+1}</span><span class="map-icon">${icon(j.icon)}</span><h3>${esc(j.name)}</h3><p>${esc(j.subtitle)}</p></button>`).join('')}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:19px"><span style="font-size:12px;color:#accbd7">Cada rota tem: cenário, ação, informações e orientação ao cliente.</span><button class="button button-ghost button-sm" data-go="practice">Ir direto às simulações →</button></div>`;}
function detailHtml(detail){return `<div class="detail-group"><h4>${esc(detail.title)}</h4>${detail.items.length?htmlList(detail.items):`<p>${esc(detail.body)}</p>`}</div>`;}
function renderJourney(i){const j=DATA.journeys[i];let tabBody='';if(activeTab===0)tabBody=`<span class="tab-label">IDENTIFICANDO O MOMENTO</span><h3>Quando essa jornada aparece?</h3><p>${esc(j.when)}</p><div class="small-callout" style="margin-top:20px">Observe a origem do caso e a necessidade do cliente antes de selecionar o direcionamento.</div>`;if(activeTab===1)tabBody=`<span class="tab-label">RESPONSABILIDADE DA JORNADA</span><h3>O que acontece na continuidade?</h3><p>${esc(j.does)}</p><div class="small-callout" style="margin-top:20px">O encaminhamento correto permite que a etapa seguinte continue a tratativa.</div>`;if(activeTab===2)tabBody=`<span class="tab-label">REGISTROS, FLUXOS E CUIDADOS</span><h3>O que não pode passar despercebido?</h3>${j.details.map(detailHtml).join('')}${j.callouts.map(c=>`<div class="small-callout"><strong>${esc(c.title)}:</strong> ${esc(c.text)}</div>`).join('')}`;if(activeTab===3)tabBody=`<span class="tab-label">COMUNICAÇÃO COM O CLIENTE</span><h3>Como explicar o próximo passo?</h3><p style="font-size:17px;color:#e7fff7">${esc(j.speech)}</p>${j.callouts.map(c=>`<div class="small-callout"><strong>${esc(c.title)}:</strong> ${esc(c.text)}</div>`).join('')}`;return `<div style="--accent:${j.color};height:100%"><div class="journey-head"><div class="journey-badge">${String(i+1).padStart(2,'0')}</div><div><div class="kicker" style="color:var(--accent)">ROTA ${String(i+1).padStart(2,'0')} · ${esc(j.subtitle)}</div><h1 class="page-title">${esc(j.name)}</h1><p class="page-lead">${esc(j.intro)}</p></div><span class="journey-pill">Jornada ${i+1} de 8</span></div><div class="journey-content"><div class="journey-story panel"><div class="mini-tag">VISÃO DO ATENDIMENTO</div><div class="story-icon">${icon(j.icon)}</div><h3>A demanda chegou.<br>Qual é o próximo caminho?</h3><p>${esc(j.when)}</p><div class="story-step">◎ &nbsp; ORIGEM DO CASO → IDENTIFICAÇÃO → CONTINUIDADE</div></div><div class="journey-sheet panel"><div class="sheet-tabs" role="tablist" aria-label="Conteúdo da jornada">${['O cenário','Próximo passo','Pontos de atenção','Como orientar'].map((name,k)=>`<button role="tab" aria-selected="${activeTab===k}" class="sheet-tab ${activeTab===k?'active':''}" data-tab="${k}">${name}</button>`).join('')}</div><div class="tab-body" role="tabpanel">${tabBody}</div></div></div><div class="speech-strip"><div class="speech-avatar">“</div><div class="speech-content"><strong>EXEMPLO DE FALA AO CLIENTE</strong><p>${esc(j.speech)}</p></div><button class="speech-open" data-copy="${esc(j.speech)}">Copiar fala</button></div></div>`;}
const scenarioChoices=[[0,7,1,4],[3,1,0,5],[2,3,5,7],[0,7,1,6],[4,0,7,3],[5,2,6,1]];
function renderPractice(){const sc=DATA.scenarios[caseIndex], chosen=saved.scenarioAnswers[caseIndex],answered=chosen!==undefined,correct=answered&&Number(chosen)===sc.correct;return `<div class="intro-head"><div class="kicker"><span class="dot"></span> CAPÍTULO 03 · SIMULAÇÃO DE ATENDIMENTO</div><h1 class="page-title">Você decide o próximo passo.</h1><p class="page-lead">Leia a situação e escolha a rota. Você terá um retorno imediato e poderá visitar o conteúdo correspondente para revisar.</p></div><div class="practice-layout"><div class="case-left panel"><div class="case-step">CASO ${caseIndex+1} DE ${DATA.scenarios.length}</div><h3>${esc(sc.title.replace(/^Caso \d+\s*\|\s*/i,''))}</h3><p>${esc(sc.text)}</p><div class="case-task"><strong>SUA MISSÃO</strong><div style="margin-top:5px">${esc(sc.task)}</div></div></div><div class="case-right panel"><div class="kicker" style="font-size:10px">TOMADA DE DECISÃO</div><h3>Qual jornada deve assumir?</h3><div class="choices">${scenarioChoices[caseIndex].map(idx=>`<button class="choice ${answered?(idx===sc.correct?'correct':idx===Number(chosen)?'wrong':''):''}" ${answered?'disabled':''} data-case-answer="${idx}">${esc(DATA.journeys[idx].name)}</button>`).join('')}</div>${answered?`<div class="feedback-box ${correct?'good':'bad'}"><strong>${correct?'✓ Boa escolha!':'◌ Vale revisar essa rota.'}</strong><div style="margin-top:5px">A jornada indicada é <strong>${esc(DATA.journeys[sc.correct].name)}</strong>. ${esc(DATA.journeys[sc.correct].does)}</div></div><div class="case-actions"><button class="button button-ghost button-sm" data-go="${DATA.journeys[sc.correct].id}">Revisar jornada</button><button class="button button-primary button-sm" data-next-case>${caseIndex===5?'Rever simulações':'Próximo caso →'}</button><button class="button button-ghost button-sm" data-redo-case>Refazer</button></div>`:`<div class="feedback-box">Escolha uma das quatro opções. O feedback aparecerá aqui.</div>`}</div></div><div class="practice-bottom"><div class="mini-dots">${DATA.scenarios.map((_,i)=>`<button aria-label="Ir ao caso ${i+1}" title="Caso ${i+1}" class="${i===caseIndex?'active':''} ${saved.scenarioAnswers[i]!==undefined?'done':''}" data-case="${i}"></button>`).join('')}</div><span>${Object.keys(saved.scenarioAnswers).length} de 6 situações respondidas · Você pode revisitar qualquer caso.</span></div>`;}
function renderLookup(){const filtered=DATA.quick.map((q,i)=>({...q,i})).filter(q=>normalize(q.title+' '+q.description+' '+DATA.journeys[q.journey].name).includes(normalize(lookupTerm)));return `<div class="intro-head"><div class="kicker"><span class="dot"></span> GUIA DE BOLSO · CONSULTA PÓS-TREINAMENTO</div><h1 class="page-title">Qual rota combina com esta situação?</h1><p class="page-lead">Uma consulta rápida para voltar quantas vezes quiser. Busque por palavras como OS, acordo, Reclame Aqui, recall ou revenda.</p></div><div class="quicksearch"><input class="search-input" id="lookup-search" placeholder="Pesquisar por situação, origem ou jornada..." aria-label="Pesquisar situações" value="${esc(lookupTerm)}"><button class="button button-ghost" id="clear-lookup">Limpar</button></div><div class="lookup-grid" id="lookup-results">${renderLookupItems(filtered)}</div><div class="lookup-foot">Resultados baseados nas situações do treinamento. Confirme sempre o cenário e as informações do caso.</div>`;}
function renderLookupItems(filtered){if(!filtered.length)return `<div class="no-results">Nenhuma situação encontrada. Tente buscar por outro termo.</div>`;return filtered.map(q=>`<button class="lookup-card" data-quick="${q.i}"><div><strong>${esc(q.title)}</strong><span>→ ${esc(DATA.journeys[q.journey].name)}</span></div><span class="arrow">↗</span></button>`).join('');}
function renderQuiz(){if(quizIndex===null)return `<div class="intro-head"><div class="kicker"><span class="dot"></span> CAPÍTULO 04 · DESAFIOS DE FIXAÇÃO</div><h1 class="page-title">Pronto para colocar em prática?</h1><p class="page-lead">Três desafios com quatro perguntas cada, adaptados dos jogos do treinamento original. Você recebe feedback após responder e pode refazer quantas vezes quiser.</p></div><div class="quiz-select">${DATA.quizzes.map((q,i)=>`<button class="quiz-card" data-start-quiz="${i}"><div class="quiz-card-num">0${i+1}</div><h3>${esc(q.title)}</h3><p>${esc(q.description)}</p><div class="quiz-meta"><span>4 perguntas ${saved.bestScores[i]!==undefined?'· Melhor: '+saved.bestScores[i]+'/4':''}</span><span>Iniciar →</span></div></button>`).join('')}</div><p style="color:#9bbac9;font-size:12px;margin:22px 0">Não há bloqueio entre etapas: este treinamento também funciona como material de consulta.</p>`;const q=DATA.quizzes[quizIndex];const one=q.questions[questionIndex];if(quizFinished){let msg=quizScore===4?'Excelente. Você reconheceu as jornadas e demonstrou boa leitura de continuidade do caso.':quizScore>=3?'Bom resultado. Revise as diferenças entre jornadas parecidas antes de atender.':'Vale revisar o mapa geral. Foque em origem do caso, OS, acordo, recall e reclamações públicas.';return `<div class="quiz-shell"><div class="quiz-side panel"><div class="kicker">RESULTADO DO DESAFIO</div><h3>${esc(q.title)}</h3><p>Esta é uma revisão livre. Você pode retornar às rotas e tentar novamente.</p><div class="meta-row"><div class="q-metric">Melhor resultado: ${saved.bestScores[quizIndex]}/4</div></div></div><div class="quiz-main panel"><div class="quiz-result"><span class="big">${quizScore}/4</span><h3>Desafio concluído</h3><p>${esc(msg)}</p><div class="quiz-actions"><button class="button button-ghost" data-reset-quiz>Refazer desafio</button><button class="button button-primary" data-all-quizzes>Escolher outro jogo →</button></div></div></div></div>`;}
const answered=quizAnswered!==null;return `<div class="quiz-shell"><div class="quiz-side panel"><div class="kicker">DESAFIO ${quizIndex+1} DE 3</div><h3>${esc(q.title)}</h3><p>${esc(q.description)}</p><div class="meta-row"><div class="q-metric">Pergunta ${questionIndex+1}/4</div><div class="q-metric">Acertos: ${quizScore}</div></div><button style="margin-top:18px" class="button button-ghost button-sm" data-all-quizzes>← Todos os jogos</button></div><div class="quiz-main panel"><div class="kicker">ESCOLHA UMA RESPOSTA</div><div class="question">${esc(one.question)}</div><div class="choices">${[0,1,2,3].map(k=>(k+questionIndex+quizIndex+1)%4).map(i=>`<button class="choice ${answered?(i===one.correct?'correct':i===quizAnswered?'wrong':''):''}" ${answered?'disabled':''} data-quiz-answer="${i}">${esc(one.options[i])}</button>`).join('')}</div>${answered?`<div class="quiz-feedback">${esc(quizAnswered===one.correct?one.feedbackCorrect:one.feedbackWrong)}</div><div class="quiz-actions"><button class="button button-primary button-sm" data-next-question>${questionIndex===3?'Ver meu resultado →':'Próxima pergunta →'}</button></div>`:''}</div></div>`;}
function renderEnd(){const visitedJourneys=DATA.journeys.filter((_,i)=>saved.visited.includes(i+3)).length;return `<div class="end-layout"><div class="end-left"><div class="kicker"><span class="dot"></span> FIM DO ROTEIRO · O GUIA CONTINUA DISPONÍVEL</div><h1 class="end-h">A jornada termina.<br>O <span>aprendizado</span><br>continua.</h1><p>A pergunta central é: <strong>para onde esse caso vai agora?</strong> Quando a resposta fica clara, o atendimento ganha segurança e o cliente percebe continuidade.</p><div class="end-actions"><button class="button button-primary" data-go="map">Revisitar jornadas ◈</button><button class="button button-ghost" data-go="lookup">Abrir consulta rápida</button></div><p style="font-size:12px;color:#81aaba;margin-top:21px">${visitedJourneys} de 8 jornadas visitadas · Seu progresso fica salvo neste navegador.</p></div><div class="takeaway-panel panel"><h3>Três atitudes para levar ao atendimento</h3><div class="takeaway-item"><div class="takeaway-num">01</div><div><strong>Identifique o cenário</strong><p>Entenda se envolve OS, acordo, reclamação pública, revenda, recall ou acompanhamento.</p></div></div><div class="takeaway-item"><div class="takeaway-num">02</div><div><strong>Direcione para a jornada correta</strong><p>Cada uma tem uma função específica na continuidade. Isso reduz retrabalho e ruídos.</p></div></div><div class="takeaway-item"><div class="takeaway-num">03</div><div><strong>Registre com clareza</strong><p>A próxima etapa precisa conhecer o histórico, a situação e o passo esperado pelo cliente.</p></div></div></div></div>`;}
function wireScene(){document.querySelectorAll('#scene [data-go]').forEach(b=>b.addEventListener('click',()=>navigate(/^\d+$/.test(b.dataset.go)?Number(b.dataset.go):b.dataset.go)));document.querySelectorAll('#scene [data-concept]').forEach(b=>b.addEventListener('click',()=>{conceptFocus=Number(b.dataset.concept);render();}));document.querySelectorAll('#scene [data-tab]').forEach(b=>b.addEventListener('click',()=>{activeTab=Number(b.dataset.tab);render();}));document.querySelectorAll('#scene [data-copy]').forEach(b=>b.addEventListener('click',()=>{const text=b.getAttribute('data-copy');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>{b.textContent='Copiado ✓'},()=>fallbackCopy(text,b));}else fallbackCopy(text,b)}));document.querySelectorAll('#scene [data-case]').forEach(b=>b.addEventListener('click',()=>{caseIndex=Number(b.dataset.case);render();}));document.querySelectorAll('#scene [data-case-answer]').forEach(b=>b.addEventListener('click',()=>{saved.scenarioAnswers[caseIndex]=Number(b.dataset.caseAnswer);persist();render();}));const nextCase=$('[data-next-case]');if(nextCase)nextCase.addEventListener('click',()=>{caseIndex=(caseIndex+1)%6;render();});const redo=$('[data-redo-case]');if(redo)redo.addEventListener('click',()=>{delete saved.scenarioAnswers[caseIndex];persist();render();});const lookup=$('#lookup-search');if(lookup){lookup.addEventListener('input',()=>{lookupTerm=lookup.value;const filtered=DATA.quick.map((q,i)=>({...q,i})).filter(q=>normalize(q.title+' '+q.description+' '+DATA.journeys[q.journey].name).includes(normalize(lookupTerm)));$('#lookup-results').innerHTML=renderLookupItems(filtered);wireQuick();});wireQuick();const clear=$('#clear-lookup');clear.addEventListener('click',()=>{lookupTerm='';render();$('#lookup-search').focus();});}document.querySelectorAll('#scene [data-start-quiz]').forEach(b=>b.addEventListener('click',()=>startQuiz(Number(b.dataset.startQuiz))));document.querySelectorAll('#scene [data-quiz-answer]').forEach(b=>b.addEventListener('click',()=>{if(quizAnswered!==null)return;quizAnswered=Number(b.dataset.quizAnswer);if(quizAnswered===DATA.quizzes[quizIndex].questions[questionIndex].correct)quizScore++;render();}));const nq=$('[data-next-question]');if(nq)nq.addEventListener('click',()=>{if(questionIndex===3){quizFinished=true;saved.bestScores[quizIndex]=Math.max(saved.bestScores[quizIndex]||0,quizScore);persist();}else{questionIndex++;quizAnswered=null;}render();});const all=$('[data-all-quizzes]');if(all)all.addEventListener('click',()=>{quizIndex=null;render();});const reset=$('[data-reset-quiz]');if(reset)reset.addEventListener('click',()=>startQuiz(quizIndex));}
function fallbackCopy(text,b){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');b.textContent='Copiado ✓'}catch(e){b.textContent='Selecione a fala'}t.remove();}
function wireQuick(){document.querySelectorAll('#lookup-results [data-quick]').forEach(b=>b.addEventListener('click',()=>showQuick(Number(b.dataset.quick))));}
function startQuiz(i){quizIndex=i;questionIndex=0;quizScore=0;quizAnswered=null;quizFinished=false;render();}
function showQuick(i){const q=DATA.quick[i];openOverlay(`<div class="modal-head"><div><div class="kicker">CONSULTA RÁPIDA · CENÁRIO ${i+1}</div><h2 class="modal-title">${esc(q.title)}</h2></div><button class="modal-close" data-close>×</button></div><p class="modal-copy">${esc(q.description)}</p><div class="notice">Jornada provável: <strong>${esc(DATA.journeys[q.journey].name)}</strong>. Confirme o contexto do caso antes de seguir.</div><div class="modal-foot"><button class="button button-primary" data-modal-go="${DATA.journeys[q.journey].id}">Abrir a jornada →</button><button class="button button-ghost" data-close>Voltar à consulta</button></div>`);}
function openOverlay(content){overlayIsOpen=true;$('#overlay').style.display='flex';$('#overlay').setAttribute('aria-hidden','false');$('#modal').innerHTML=content;$('#modal').querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeOverlay));$('#modal').querySelectorAll('[data-modal-go]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.modalGo)));$('#modal').querySelector('.modal-close')?.focus();}
function closeOverlay(){overlayIsOpen=false;$('#overlay').style.display='none';$('#overlay').setAttribute('aria-hidden','true');}
function openMapModal(){openOverlay(`<div class="modal-head"><div><div class="kicker">NAVEGAÇÃO LIVRE</div><h2 class="modal-title">Escolha onde continuar</h2></div><button class="modal-close" data-close>×</button></div><p class="modal-copy">Você pode voltar a qualquer etapa já visitada ou explorar uma rota nova. As oito jornadas estão sempre disponíveis.</p><div class="overlay-grid">${STAGES.map((st,i)=>`<button class="overlay-item" data-modal-go="${st.id}"><span>${saved.visited.includes(i)?'✓ VISITADA':`ETAPA ${String(i+1).padStart(2,'0')}`}</span>${esc(st.title)}</button>`).join('')}</div>`);}
$('#map-button').addEventListener('click',openMapModal);$('#lookup-button').addEventListener('click',()=>navigate('lookup'));$('#prev-button').addEventListener('click',()=>navigate(active-1));$('#next-button').addEventListener('click',()=>navigate(active+1));$('#home-button').addEventListener('click',()=>navigate(0));$('#fullscreen-button').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.();});$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeOverlay();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlayIsOpen){closeOverlay();return;}if(overlayIsOpen||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight')navigate(active+1);if(e.key==='ArrowLeft')navigate(active-1);});
// Show the initial screen and preserve the previous session for "Retomar".
if(!saved.visited.includes(0))saved.visited.push(0);persist();render();
</script>
</body>
</html>
